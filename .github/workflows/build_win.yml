name: Build ScriptGlass EXE

on:
  push:
    branches:
      - main  # Runs every time you push to the main branch
  workflow_dispatch: # Allows you to run it manually from the GitHub UI

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build and Package
        run: npm run dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScriptGlass-Windows-Portable
          path: dist_electron/*.exe  # This grabs your portable .exe
          retention-days: 90  # How long the download link lasts
